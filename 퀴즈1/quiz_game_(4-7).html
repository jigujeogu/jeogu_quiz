<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 퀴즈 게임 (화면 4 ~ 7)</title>
  <link rel="preload" href="../fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
  <script src="../bgm.js"></script>
  <script src="../back_button.js"></script>
  <script src="../quiz_sfx_b64.js"></script>
  <style>
@font-face {
  font-family: 'Pretendard';
  src: url('../fonts/PretendardVariable.woff2') format('woff2');
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
}

/* Style Design System for 16:9 Vertical Game Screen (1080px x 1920px) */
:root {
  --game-width: 1080px;
  --game-height: 1920px;
  --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  --text-color: #0F1811;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background-color: #000000;
  font-family: var(--font-family);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #111111;
}

.game-container {
  position: absolute;
  width: var(--game-width);
  height: var(--game-height);
  aspect-ratio: 9 / 16;
  background-color: transparent;
  overflow: hidden;
  transform-origin: 0 0;
}

.game-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.game-bg img.bg-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.game-text-container {
  position: absolute;
  left: 198.07px;
  top: 226.39px;
  width: 683.86px;
  z-index: 5;
  pointer-events: none;
}

.typing-text {
  font-family: var(--font-family);
  font-weight: 600;
  font-size: 38pt;
  line-height: 140%;
  color: var(--text-color);
  letter-spacing: -0.02em;
  white-space: pre;
  word-break: keep-all;
  text-align: center;
}

.typing-text .font-extrabold,
.typing-text .font-black {
  font-weight: 800;
}

.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background-color: var(--text-color);
  margin-left: 2px;
  vertical-align: sub;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.hidden {
  display: none !important;
}

.co2-pulse-box {
  position: absolute;
  left: 57.305%;
  top: 59.574%;
  width: 0;
  height: 0;
  z-index: 10;
  pointer-events: none;
}

.co2-top-pin {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 420px;
  transform: translate(-50%, -50%);
  z-index: 3;
  display: block;
}

.question-prompt-overlay {
  position: absolute;
  left: 139.5px;
  top: 101px;
  width: 801px;
  height: 380px;
  z-index: 5;
  pointer-events: none;
}

.blue-circle-1 {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 440px;
  height: 440px;
  transform: translate3d(-50%, -50%, 0);
  z-index: 2;
  pointer-events: none;
  will-change: transform, opacity;
  animation: reversePulseInner 2.2s infinite alternate cubic-bezier(0.45, 0.05, 0.25, 1);
}

.blue-circle-2 {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 530px;
  height: 530px;
  transform: translate3d(-50%, -50%, 0);
  z-index: 1;
  pointer-events: none;
  will-change: transform, opacity;
  animation: reversePulseOuter 2.2s infinite alternate cubic-bezier(0.45, 0.05, 0.25, 1);
}

@keyframes reversePulseInner {
  0% { transform: translate3d(-50%, -50%, 0) scale(0.85); opacity: 0.3; }
  100% { transform: translate3d(-50%, -50%, 0) scale(1.28); opacity: 0.95; }
}

@keyframes reversePulseOuter {
  0% { transform: translate3d(-50%, -50%, 0) scale(0.85); opacity: 0.2; }
  100% { transform: translate3d(-50%, -50%, 0) scale(1.36); opacity: 0.8; }
}

.screen4-options-grid {
  position: absolute;
  left: 65px;
  top: 1310px;
  width: 950px;
  height: 544px;
  z-index: 10;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  column-gap: 55px;
  row-gap: 40px;
}

.bg-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: 1;
}

.animated-clouds-group-wrapper {
  position: absolute;
  top: 70px;
  left: 0;
  width: 100%;
  height: 1553px;
  overflow: visible;
  z-index: 2;
  pointer-events: none;
  contain: strict;
  transform: translateZ(0);
}

.clouds-loop-track {
  display: flex;
  width: max-content;
  height: 100%;
  animation: moveCloudsGroup 35s linear infinite;
  will-change: transform;
}

.clouds-group-img {
  flex: 0 0 3200px;
  width: 3200px;
  height: auto;
  display: block;
}

@keyframes moveCloudsGroup {
  0% { transform: translateX(-3200px); }
  100% { transform: translateX(0); }
}

.sky-gradation-wrapper {
  position: absolute;
  left: 0;
  bottom: 785px;
  width: 1080px;
  height: 340px;
  z-index: 3;
  pointer-events: none;
}

.sky-gradation-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.top-title-wrapper {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  pointer-events: none;
  width: 750px;
  text-align: center;
}

.title-textgroup-img {
  width: 100%;
  height: auto;
  display: block;
}

.ground-wrapper {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 1080px;
  height: auto;
  z-index: 5;
  pointer-events: none;
}

.ground-img {
  width: 100%;
  height: auto;
  display: block;
}

.animated-truck-wrapper,
.animated-vehicle-wrapper {
  position: absolute;
  left: 0;
  z-index: 6;
  pointer-events: none;
}

.animated-truck-wrapper {
  bottom: 785px;
  animation: moveVehicleAcross 10.5s linear infinite;
}

.screen5-vehicle {
  bottom: 785px;
  animation: moveVehicleAcross 10s linear infinite;
}

.screen6-vehicle {
  bottom: 760px;
  animation: moveVehicleAcross 12s linear infinite;
}

.truck-box,
.vehicle-box {
  position: relative;
  display: inline-block;
}

.truck-box {
  animation: vehicleJolt 0.35s ease-in-out infinite alternate;
}

.screen5-vehicle .vehicle-box {
  animation: vehicleJolt 0.3s ease-in-out infinite alternate;
}

.screen6-vehicle .vehicle-box {
  animation: shipFloating 2s ease-in-out infinite alternate;
}

.truck-img {
  width: 370px;
  height: auto;
  display: block;
}

.train-img {
  width: 380px;
  height: auto;
  display: block;
}

.ship-img {
  width: 440px;
  height: auto;
  display: block;
}

@keyframes moveVehicleAcross {
  0% { transform: translateX(-500px); }
  100% { transform: translateX(1150px); }
}

@keyframes vehicleJolt {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-5px) rotate(-0.8deg); }
  100% { transform: translateY(3px) rotate(0.8deg); }
}

@keyframes shipFloating {
  0% { transform: translateY(0px) rotate(-1deg); }
  100% { transform: translateY(-8px) rotate(1deg); }
}

.co2-exhaust-container {
  position: absolute;
  left: -70px;
  bottom: 30px;
  width: 140px;
  height: 140px;
  pointer-events: none;
}

.train-co2 {
  left: 235px;
  bottom: 180px;
}

.ship-co2 {
  left: 46px;
  bottom: 160px;
}

.co2-puff {
  position: absolute;
  width: 75px;
  height: 75px;
  animation: puffCO2Emissions 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
}

.puff-1 { animation-delay: 0s; }
.puff-2 { animation-delay: 0.55s; }
.puff-3 { animation-delay: 1.1s; }
.puff-4 { animation-delay: 1.65s; }

@keyframes puffCO2Emissions {
  0% { transform: translate(30px, 10px) scale(0.25); opacity: 0.95; }
  35% { transform: translate(-30px, -25px) scale(0.6); opacity: 0.8; }
  70% { transform: translate(-90px, -65px) scale(0.95); opacity: 0.45; }
  100% { transform: translate(-140px, -100px) scale(1.3); opacity: 0; }
}

.animated-plane-small-wrapper {
  position: absolute;
  left: 0;
  bottom: 1380px;
  z-index: 6;
  pointer-events: none;
  animation: flySmallPlaneLeft 7.5s linear infinite;
}

.animated-plane-big-wrapper {
  position: absolute;
  left: 0;
  bottom: 1000px;
  z-index: 6;
  pointer-events: none;
  animation: flyBigPlaneRight 6.5s linear infinite;
}

.plane-box {
  position: relative;
  display: inline-block;
}

.big-plane-img {
  width: 390px;
  height: auto;
  display: block;
}

.small-plane-img {
  width: 210px;
  height: auto;
  display: block;
  transform: scaleX(-1);
}

@keyframes flyBigPlaneRight {
  0% { transform: translate(-450px, 140px) rotate(-6deg); }
  35% { transform: translate(100px, 100px) rotate(-11deg); }
  70% { transform: translate(650px, 0px) rotate(-19deg); }
  100% { transform: translate(1180px, -180px) rotate(-26deg); }
}

@keyframes flySmallPlaneLeft {
  0% { transform: translate(1180px, 140px) rotate(6deg); }
  35% { transform: translate(650px, 100px) rotate(11deg); }
  70% { transform: translate(100px, 0px) rotate(19deg); }
  100% { transform: translate(-450px, -180px) rotate(26deg); }
}

.small-plane-co2 {
  position: absolute;
  left: auto;
  right: -45px;
  bottom: 15px;
  width: 100px;
  height: 100px;
  pointer-events: none;
}

.small-plane-co2 .co2-puff {
  position: absolute;
  width: 45px;
  height: 45px;
  animation: puffCO2EmissionsSmall 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
}

.small-plane-co2 .puff-1 { animation-delay: 0s; }
.small-plane-co2 .puff-2 { animation-delay: 0.55s; }
.small-plane-co2 .puff-3 { animation-delay: 1.1s; }
.small-plane-co2 .puff-4 { animation-delay: 1.65s; }

@keyframes puffCO2EmissionsSmall {
  0% { transform: translate(-10px, 10px) scale(0.25); opacity: 0.95; }
  35% { transform: translate(30px, -20px) scale(0.6); opacity: 0.8; }
  70% { transform: translate(75px, -50px) scale(0.95); opacity: 0.45; }
  100% { transform: translate(115px, -80px) scale(1.3); opacity: 0; }
}

.big-plane-co2 {
  left: -70px;
  bottom: 25px;
}

.option-btn {
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 0;
  width: 447px;
  height: 252px;
  transition: opacity 0.2s ease, transform 0.1s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.option-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
}

.option-btn:not(:disabled):not(.disabled):hover {
  opacity: 0.5;
}

.option-btn:active {
  transform: scale(0.97);
}

.option-btn.selected-correct,
.option-btn:disabled.selected-correct,
.option-btn.selected-correct:hover,
.option-btn:disabled.selected-correct:hover {
  opacity: 0.5 !important;
  pointer-events: none !important;
  cursor: default !important;
}

.option-btn:disabled:not(.selected-correct),
.option-btn.disabled:not(.selected-correct),
.option-btn:disabled:not(.selected-correct):hover,
.option-btn.disabled:not(.selected-correct):hover {
  opacity: 1 !important;
  pointer-events: none !important;
  cursor: default !important;
}

.popup-overlay-wrapper {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 100;
  background-color: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.popup-overlay-wrapper.hidden {
  display: none;
  pointer-events: none;
}

.popup-content {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 1080px;
  height: auto;
  cursor: pointer;
}

.popup-overlay-wrapper:not(.hidden) .popup-content {
  animation: popupSlideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes popupSlideUp {
  0% {
    transform: translateY(100%);
    opacity: 0;
  }

  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

.popup-content img {
  width: 100%;
  height: auto;
  display: block;
}

.congratulation-overlay-wrapper {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 120;
  background-color: rgba(0, 0, 0, 0.5);
  opacity: 1;
  visibility: visible;
}

#confetti-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 1080px;
  height: 1920px;
  z-index: 120;
  pointer-events: none;
  display: none;
}

.congratulation-overlay-wrapper.hidden {
  opacity: 0;
  pointer-events: none;
}

.congratulation-card {
  position: absolute;
  top: 516.93px;
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  width: 799px;
  height: 866px;
  z-index: 121;
  pointer-events: none;
}

.congratulation-overlay-wrapper:not(.hidden) .congratulation-card,
.congratulation-overlay-wrapper:not(.hidden) .next-btn {
  animation: congratsPop 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes congratsPop {
  0% {
    transform: translateX(-50%) scale(0.85);
    opacity: 0;
  }

  60% {
    transform: translateX(-50%) scale(1.03);
    opacity: 1;
  }

  100% {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }
}

.congratulation-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.next-btn {
  position: absolute;
  top: 1127.18px;
  left: 50%;
  transform: translateX(-50%);
  width: 553px;
  height: 119px;
  z-index: 122;
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 0;
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), filter 0.1s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.next-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
}

.next-btn:active {
  transform: translateX(-50%) translateY(4px) scale(0.97);
  filter: brightness(0.95);
}

.screen-section {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  display: block;
  pointer-events: auto;
}

.screen-section.hidden-screen,
.screen-section.hidden-screen * {
  display: none !important;
  animation-play-state: paused !important;
  pointer-events: none !important;
}

.animated-truck-wrapper,
.animated-vehicle-wrapper,
.animated-plane-small-wrapper,
.animated-plane-big-wrapper,
.co2-puff {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
  will-change: transform;
}
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-container" id="gameContainer">
      <!-- 1. Shared Background Sky (background sky.svg) -->
      <div class="game-bg">
        <img src="assets/background sky.svg" alt="하늘 배경" class="bg-img">
      </div>

      <!-- 2. Shared Animated Clouds Group -->
      <div class="animated-clouds-group-wrapper">
        <div class="clouds-loop-track">
          <img src="assets/clouds group .svg" alt="구름 그룹" class="clouds-group-img">
          <img src="assets/clouds group .svg" alt="" aria-hidden="true" class="clouds-group-img">
        </div>
      </div>

      <!-- 3. Shared Sky Gradation -->
      <div class="sky-gradation-wrapper">
        <img src="assets/sky gradation.svg" alt="하늘 그라데이션" class="sky-gradation-img">
      </div>

      <!-- 4. Shared Title & Quiz Banner -->
      <div class="top-title-wrapper">
        <img src="assets/quiz bt textGroup.svg" alt="Quiz 1 운송방식에 알맞은 이산화탄소 배출량을 골라주세요" class="title-textgroup-img">
      </div>

      <!-- ==================== SCREEN 4 (ROAD TRANSPORT) ==================== -->
      <div class="screen-section" id="screen4">
        <div class="ground-wrapper">
          <img src="assets/ground4.svg" alt="지면 및 질문 카드" class="ground-img">
        </div>
        <div class="animated-truck-wrapper">
          <div class="truck-box">
            <div class="co2-exhaust-container">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-1" alt="CO2 배출 1">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-2" alt="CO2 배출 2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-3" alt="CO2 배출 3">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-4" alt="CO2 배출 4">
            </div>
            <img src="assets/truck(수정) .png" class="truck-img" alt="도로 운송 트럭">
          </div>
        </div>
        <div class="screen4-options-grid">
          <button type="button" class="option-btn" data-answer="person" aria-label="사람 무게">
            <img src="assets/road_person.svg" alt="사람 무게">
          </button>
          <button type="button" class="option-btn" data-answer="boar" aria-label="멧돼지 무게">
            <img src="assets/road_boar.svg" alt="멧돼지 무게">
          </button>
          <button type="button" class="option-btn" data-answer="horse" aria-label="말 무게 (정답)">
            <img src="assets/road_horse.svg" alt="말 무게">
          </button>
          <button type="button" class="option-btn" data-answer="rhino" aria-label="코뿔소 무게">
            <img src="assets/road_rhino.svg" alt="코뿔소 무게">
          </button>
        </div>
      </div>

      <!-- ==================== SCREEN 5 (RAIL TRANSPORT) ==================== -->
      <div class="screen-section hidden-screen" id="screen5">
        <div class="ground-wrapper">
          <img data-src="assets/ground5.svg" alt="지면 및 질문 카드" class="ground-img">
        </div>
        <div class="animated-vehicle-wrapper screen5-vehicle">
          <div class="vehicle-box">
            <div class="co2-exhaust-container train-co2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-1" alt="CO2 배출 1">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-2" alt="CO2 배출 2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-3" alt="CO2 배출 3">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-4" alt="CO2 배출 4">
            </div>
            <img data-src="assets/rail_train.svg" class="vehicle-img train-img" alt="철도 운송 기차">
          </div>
        </div>
        <div class="screen4-options-grid">
          <button type="button" class="option-btn" data-answer="person" aria-label="사람 무게">
            <img data-src="assets/rail_person.svg" alt="사람 무게">
          </button>
          <button type="button" class="option-btn" data-answer="boar" aria-label="멧돼지 무게 (정답)">
            <img data-src="assets/rail_boar.svg" alt="멧돼지 무게">
          </button>
          <button type="button" class="option-btn" data-answer="horse" aria-label="말 무게">
            <img data-src="assets/rail_horse.svg" alt="말 무게">
          </button>
          <button type="button" class="option-btn" data-answer="rhino" aria-label="코뿔소 무게">
            <img data-src="assets/rail_rhino.svg" alt="코뿔소 무게">
          </button>
        </div>
      </div>

      <!-- ==================== SCREEN 6 (SEA TRANSPORT) ==================== -->
      <div class="screen-section hidden-screen" id="screen6">
        <div class="ground-wrapper">
          <img data-src="assets/ground6.svg" alt="지면 및 질문 카드" class="ground-img">
        </div>
        <div class="animated-vehicle-wrapper screen6-vehicle">
          <div class="vehicle-box">
            <div class="co2-exhaust-container ship-co2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-1" alt="CO2 배출 1">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-2" alt="CO2 배출 2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-3" alt="CO2 배출 3">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-4" alt="CO2 배출 4">
            </div>
            <img data-src="assets/sea_ship.svg" class="vehicle-img ship-img" alt="해상 운송 선박">
          </div>
        </div>
        <div class="screen4-options-grid">
          <button type="button" class="option-btn" data-answer="person" aria-label="사람 무게 (정답)">
            <img data-src="assets/sea_person.svg" alt="사람 무게">
          </button>
          <button type="button" class="option-btn" data-answer="boar" aria-label="멧돼지 무게">
            <img data-src="assets/sea_boar.svg" alt="멧돼지 무게">
          </button>
          <button type="button" class="option-btn" data-answer="horse" aria-label="말 무게">
            <img data-src="assets/sea_horse.svg" alt="말 무게">
          </button>
          <button type="button" class="option-btn" data-answer="rhino" aria-label="코뿔소 무게">
            <img data-src="assets/sea_rhino.svg" alt="코뿔소 무게">
          </button>
        </div>
      </div>

      <!-- ==================== SCREEN 7 (AIR TRANSPORT) ==================== -->
      <div class="screen-section hidden-screen" id="screen7">
        <div class="ground-wrapper">
          <img data-src="assets/ground7.svg" alt="지면 및 질문 카드" class="ground-img">
        </div>
        <div class="animated-plane-small-wrapper">
          <div class="plane-box">
            <div class="co2-exhaust-container small-plane-co2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-1" alt="CO2 배출 1">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-2" alt="CO2 배출 2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-3" alt="CO2 배출 3">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-4" alt="CO2 배출 4">
            </div>
            <img data-src="assets/air_plane.svg" class="plane-img small-plane-img" alt="작은 비행기 (좌측 비행)">
          </div>
        </div>
        <div class="animated-plane-big-wrapper">
          <div class="plane-box">
            <div class="co2-exhaust-container big-plane-co2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-1" alt="CO2 배출 1">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-2" alt="CO2 배출 2">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-3" alt="CO2 배출 3">
              <img src="assets/co2_emissions.svg" class="co2-puff puff-4" alt="CO2 배출 4">
            </div>
            <img data-src="assets/air_plane.svg" class="plane-img big-plane-img" alt="큰 비행기 (우측 비행)">
          </div>
        </div>
        <div class="screen4-options-grid">
          <button type="button" class="option-btn" data-answer="person" aria-label="사람 무게">
            <img data-src="assets/air_person.svg" alt="사람 무게">
          </button>
          <button type="button" class="option-btn" data-answer="boar" aria-label="멧돼지 무게">
            <img data-src="assets/air_boar.svg" alt="멧돼지 무게">
          </button>
          <button type="button" class="option-btn" data-answer="horse" aria-label="말 무게">
            <img data-src="assets/air_horse.svg" alt="말 무게">
          </button>
          <button type="button" class="option-btn" data-answer="rhino" aria-label="코뿔소 무게 (정답)">
            <img data-src="assets/air_rhino.svg" alt="코뿔소 무게">
          </button>
        </div>
      </div>

      <div class="popup-overlay-wrapper hidden" id="popupWrapper">
        <div class="popup-content" id="popupContent">
          <img id="popupImg" src="assets/road_correct_popup_jeogu_o.svg" alt="결과 팝업">
        </div>
      </div>

      <div class="congratulation-overlay-wrapper hidden" id="congratulationWrapper">
        <canvas id="confetti-canvas" width="1080" height="1920"></canvas>
        <div class="congratulation-card">
          <img class="congratulation-img" src="assets/congratulation_popup.png" alt="축하합니다!">
        </div>
        <button type="button" class="next-btn" id="btnNext" aria-label="다음">
          <img src="assets/next.svg" alt="다음 버튼">
        </button>
      </div>

    </div>
  </div>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  const gameContainer = document.getElementById('gameContainer');
  const popupWrapper = document.getElementById('popupWrapper');
  const popupContent = document.getElementById('popupContent');
  const popupImg = document.getElementById('popupImg');
  const congratulationWrapper = document.getElementById('congratulationWrapper');
  const congratulationCard = congratulationWrapper.querySelector('.congratulation-card');
  const btnNext = document.getElementById('btnNext');

  congratulationCard.addEventListener('animationend', event => {
    if (event.target === congratulationCard) congratulationCard.style.willChange = 'auto';
  });

  const screenPreparationCache = new Map();
  const assetPreparationCache = new Map();
  const runWhenIdle = window.requestIdleCallback
    ? callback => window.requestIdleCallback(callback, { timeout: 1000 })
    : callback => window.setTimeout(callback, 100);

  function waitForImage(image) {
    const loaded = image.complete
      ? Promise.resolve(image.naturalWidth > 0)
      : new Promise(resolve => {
          image.addEventListener('load', () => resolve(true), { once: true });
          image.addEventListener('error', () => resolve(false), { once: true });
        });

    return loaded.then(success => {
      if (!success || typeof image.decode !== 'function') return;
      return image.decode().catch(() => {});
    });
  }

  function prepareScreen(screenId) {
    if (screenPreparationCache.has(screenId)) {
      return screenPreparationCache.get(screenId);
    }

    const screen = document.getElementById(screenId);
    const preparation = screen
      ? Promise.all(Array.from(screen.querySelectorAll('img[data-src]')).map(image => {
          image.src = image.dataset.src;
          image.removeAttribute('data-src');
          return waitForImage(image);
        }))
      : Promise.resolve([]);

    screenPreparationCache.set(screenId, preparation);
    return preparation;
  }

  function prepareAsset(src) {
    if (assetPreparationCache.has(src)) {
      return assetPreparationCache.get(src);
    }

    const image = new Image();
    image.src = src;
    const preparation = waitForImage(image);
    assetPreparationCache.set(src, preparation);
    return preparation;
  }

  // ── Web Audio API 효과음 (Base64 인메모리 디코딩, BGM 간섭 원천 차단) ──
  const sfxAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let correctBuffer = null;
  let incorrectBuffer = null;
  let sfxReadyPromise = null;
  const activeSfxSources = new Map();

  const unlockAudioContext = () => {
    ensureQuizSfxReady();
    if (sfxAudioCtx.state === 'suspended') {
      sfxAudioCtx.resume();
    }
  };
  window.addEventListener('touchstart', unlockAudioContext, { passive: true });
  window.addEventListener('pointerdown', unlockAudioContext, { passive: true });
  window.addEventListener('click', unlockAudioContext, { passive: true });

  function base64ToArrayBuffer(base64) {
    const binaryString = window.atob(base64.split(',')[1]);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes.buffer;
  }

  function decodeAudio(arrayBuffer) {
    return new Promise((resolve, reject) => {
      try {
        const res = sfxAudioCtx.decodeAudioData(
          arrayBuffer,
          buf => resolve(buf),
          err => reject(err)
        );
        if (res && typeof res.then === 'function') {
          res.then(resolve).catch(reject);
        }
      } catch (e) {
        reject(e);
      }
    });
  }

  function ensureQuizSfxReady() {
    if (sfxReadyPromise) return sfxReadyPromise;

    const decodingTasks = [];
    if (typeof CORRECT_SFX_B64 !== 'undefined') {
      decodingTasks.push(
        decodeAudio(base64ToArrayBuffer(CORRECT_SFX_B64)).then(buffer => {
          correctBuffer = buffer;
        })
      );
    }
    if (typeof INCORRECT_SFX_B64 !== 'undefined') {
      decodingTasks.push(
        decodeAudio(base64ToArrayBuffer(INCORRECT_SFX_B64)).then(buffer => {
          incorrectBuffer = buffer;
        })
      );
    }

    sfxReadyPromise = Promise.all(decodingTasks).catch(error => {
      console.error('퀴즈 효과음 디코딩 에러:', error);
    });
    return sfxReadyPromise;
  }

  function playBufferSound(buffer) {
    if (sfxAudioCtx.state === 'suspended') {
      sfxAudioCtx.resume();
    }
    if (buffer) {
      try {
        const source = sfxAudioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(sfxAudioCtx.destination);
        const handleEnded = () => {
          try {
            source.disconnect();
          } catch (error) {}
          activeSfxSources.delete(source);
        };
        activeSfxSources.set(source, handleEnded);
        source.addEventListener('ended', handleEnded, { once: true });
        source.start(0);
      } catch (e) {}
    }
  }

  function stopAllSfx() {
    activeSfxSources.forEach((handleEnded, source) => {
      source.removeEventListener('ended', handleEnded);
      try {
        source.stop();
      } catch (error) {}
      try {
        source.disconnect();
      } catch (error) {}
    });
    activeSfxSources.clear();
  }

  function playCorrectSound() {
    if (correctBuffer) {
      playBufferSound(correctBuffer);
      return;
    }
    ensureQuizSfxReady().then(() => playBufferSound(correctBuffer));
  }

  function playIncorrectSound() {
    if (incorrectBuffer) {
      playBufferSound(incorrectBuffer);
      return;
    }
    ensureQuizSfxReady().then(() => playBufferSound(incorrectBuffer));
  }

  requestAnimationFrame(() => {
    runWhenIdle(() => ensureQuizSfxReady());
  });
  window.addEventListener('pagehide', stopAllSfx);

  function resizeGameContainer() {
    const baseWidth = 1080;
    const baseHeight = 1920;
    const dpr = window.devicePixelRatio || 1;
    const availableWidth = window.innerWidth;
    const availableHeight = window.innerHeight;
    const scaleX = availableWidth / baseWidth;
    const scaleY = availableHeight / baseHeight;
    const rawScale = Math.min(scaleX, scaleY);
    const renderedWidth = Math.ceil(baseWidth * rawScale * dpr) / dpr;
    const scale = renderedWidth / baseWidth;
    const renderedHeight = baseHeight * scale;
    const left = Math.round(((availableWidth - renderedWidth) / 2) * dpr) / dpr;
    const top = Math.round(((availableHeight - renderedHeight) / 2) * dpr) / dpr;

    gameContainer.style.left = `${left}px`;
    gameContainer.style.top = `${top}px`;
    gameContainer.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', resizeGameContainer);
  resizeGameContainer();

  const screensConfig = [
    { id: 'screen4', correctAnswer: 'horse', correctPopup: 'assets/road_correct_popup_jeogu_o.svg' },
    { id: 'screen5', correctAnswer: 'boar', correctPopup: 'assets/rail_correct_popup_jeogu_o.svg' },
    { id: 'screen6', correctAnswer: 'person', correctPopup: 'assets/sea_correct_popup_jeogu_o.svg' },
    { id: 'screen7', correctAnswer: 'rhino', correctPopup: 'assets/air_correct_popup_jeogu_o.svg' }
  ];

  let currentScreenIndex = 0;
  let isAnswerLocked = false;
  let isPopupPending = false;
  let isScreenTransitioning = false;

  const solvedAnswersSet = new Set();

  function markSolvedAnswersAcrossAllScreens() {
    screensConfig.forEach(config => {
      const screenElem = document.getElementById(config.id);
      if (!screenElem) return;

      const screenOptionBtns = screenElem.querySelectorAll('.option-btn');
      screenOptionBtns.forEach(btn => {
        const answerKey = btn.getAttribute('data-answer');
        if (solvedAnswersSet.has(answerKey)) {
          btn.classList.add('selected-correct');
          btn.disabled = true;
          btn.classList.add('disabled');
          btn.style.opacity = '0.5';
          btn.style.pointerEvents = 'none';
          btn.style.cursor = 'default';
        }
      });
    });
  }

  const incorrectPopups = [
    'assets/quiz1_incorrect_popup1_jeogu_o.svg',
    'assets/quiz1_incorrect_popup2_jeogu_o.svg'
  ];
  let lastIncorrectIndex = -1;

  function preparePopupAssets() {
    const popupAssets = [
      ...screensConfig.map(config => config.correctPopup),
      ...incorrectPopups
    ];
    return Promise.all(popupAssets.map(prepareAsset));
  }

  function getNextIncorrectPopup() {
    let nextIndex = Math.floor(Math.random() * incorrectPopups.length);
    if (nextIndex === lastIncorrectIndex) {
      nextIndex = (nextIndex + 1) % incorrectPopups.length;
    }
    lastIncorrectIndex = nextIndex;
    return incorrectPopups[nextIndex];
  }

  const confettiCanvas = document.getElementById('confetti-canvas');
  const confettiCtx = confettiCanvas ? confettiCanvas.getContext('2d', { alpha: true }) : null;
  let confettiParticles = [];
  let confettiAnimId = null;
  const CONFETTI_PARTICLE_COUNT = 80;
  const CONFETTI_MAX_DURATION_MS = 2500;

  const CONFETTI_COLORS = [
    '#35D047', '#0E9D2D', '#4CEE5F',
    '#FF66B6', '#FFD7EC', '#FF1493',
    '#FFC25F', '#FFA500', '#FFD700',
    '#407AB9', '#60A5FA', '#38BDF8',
    '#FFFFFF'
  ];

  class ConfettiParticle {
    constructor(originX, originY) {
      this.x = originX + (Math.random() * 260 - 130);
      this.y = originY + (Math.random() * 100 - 50);

      // 상단 및 양옆으로 팡 터져나가는 속도
      const angle = (Math.PI * 1.5) + (Math.random() * 1.6 - 0.8);
      const speed = 22 + Math.random() * 26;
      this.vx = Math.cos(angle) * speed + (Math.random() * 16 - 8);
      this.vy = Math.sin(angle) * speed - (10 + Math.random() * 14);

      this.gravity = 0.65 + Math.random() * 0.3;
      this.friction = 0.965;

      this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      this.type  = Math.floor(Math.random() * 3); // 0: 리본, 1: 원형 도트, 2: 별/다이아

      this.size   = 18 + Math.random() * 18;
      this.aspect = 0.35 + Math.random() * 0.5;

      this.rotation  = Math.random() * Math.PI * 2;
      this.rotSpeed  = (Math.random() * 0.16 - 0.08);

      this.flip      = Math.random() * Math.PI;
      this.flipSpeed = 0.09 + Math.random() * 0.14;

      this.opacity   = 1;
      this.fadeSpeed = 0.004 + Math.random() * 0.006;
      this.life      = 1;
    }

    update() {
      this.vx *= this.friction;
      this.vy *= this.friction;
      this.vy += this.gravity;

      this.x += this.vx;
      this.y += this.vy;

      this.rotation += this.rotSpeed;
      this.flip += this.flipSpeed;

      if (this.vy > 3) {
        this.life -= this.fadeSpeed * 2;
        this.opacity = Math.max(0, this.life);
      }
    }

    draw(ctx) {
      if (this.opacity <= 0) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.scale(1, Math.cos(this.flip));
      ctx.globalAlpha = this.opacity;
      ctx.fillStyle   = this.color;

      if (this.type === 0) {
        ctx.fillRect(-this.size / 2, (-this.size * this.aspect) / 2, this.size, this.size * this.aspect);
      } else if (this.type === 1) {
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.38, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -this.size * 0.55);
        ctx.lineTo(this.size * 0.45, 0);
        ctx.lineTo(0, this.size * 0.55);
        ctx.lineTo(-this.size * 0.45, 0);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }
  }

  function stopConfetti() {
    if (!confettiCanvas || !confettiCtx) return;

    if (confettiAnimId !== null) {
      cancelAnimationFrame(confettiAnimId);
      confettiAnimId = null;
    }

    confettiParticles.length = 0;
    confettiCtx.clearRect(0, 0, 1080, 1920);
    confettiCanvas.style.display = 'none';
  }

  function launchConfetti() {
    if (!confettiCanvas || !confettiCtx) return;

    stopConfetti();
    confettiCanvas.width = 1080;
    confettiCanvas.height = 1920;
    confettiCanvas.style.display = 'block';

    for (let i = 0; i < CONFETTI_PARTICLE_COUNT; i++) {
      confettiParticles.push(new ConfettiParticle(540, 750));
    }

    const startedAt = performance.now();

    function render(frameTime) {
      confettiAnimId = null;

      if (frameTime - startedAt >= CONFETTI_MAX_DURATION_MS) {
        stopConfetti();
        return;
      }

      confettiCtx.clearRect(0, 0, 1080, 1920);
      let aliveCount = 0;

      for (let p of confettiParticles) {
        p.update();
        p.draw(confettiCtx);
        if (p.opacity > 0 && p.y < 1950) aliveCount++;
      }

      if (aliveCount > 0) {
        confettiAnimId = requestAnimationFrame(render);
      } else {
        stopConfetti();
      }
    }

    confettiAnimId = requestAnimationFrame(render);
  }

  window.addEventListener('pagehide', stopConfetti);

  screensConfig.forEach((config, screenIdx) => {
    const screenElem = document.getElementById(config.id);
    if (!screenElem) return;

    const screenOptionBtns = screenElem.querySelectorAll('.option-btn');

    screenOptionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isAnswerLocked || isPopupPending) return;
        if (btn.disabled || btn.classList.contains('disabled')) return;

        const selectedAnswer = btn.getAttribute('data-answer');

        if (selectedAnswer === config.correctAnswer) {
          isAnswerLocked = true;
          solvedAnswersSet.add(config.correctAnswer);

          markSolvedAnswersAcrossAllScreens();

          screenOptionBtns.forEach(b => {
            b.disabled = true;
            b.classList.add('disabled');
          });

          setTimeout(async () => {
            await prepareAsset(config.correctPopup);
            playCorrectSound();
            popupImg.src = config.correctPopup;
            popupWrapper.classList.remove('hidden');
          }, 250);

        } else {
          isPopupPending = true;
          const incorrectPopup = getNextIncorrectPopup();

          setTimeout(async () => {
            try {
              await prepareAsset(incorrectPopup);
              playIncorrectSound();
              popupImg.src = incorrectPopup;
              popupWrapper.classList.remove('hidden');
            } finally {
              isPopupPending = false;
            }
          }, 250);
        }
      });
    });
  });

  if (popupWrapper) {
    popupWrapper.addEventListener('click', async () => {
      if (isScreenTransitioning) return;

      if (isAnswerLocked) {
        if (currentScreenIndex < screensConfig.length - 1) {
          isScreenTransitioning = true;
          const nextScreenIndex = currentScreenIndex + 1;
          const currentScreenElem = document.getElementById(screensConfig[currentScreenIndex].id);
          const nextScreenElem = document.getElementById(screensConfig[nextScreenIndex].id);

          try {
            await prepareScreen(screensConfig[nextScreenIndex].id);
            popupWrapper.classList.add('hidden');

            if (currentScreenElem) currentScreenElem.classList.add('hidden-screen');
            if (nextScreenElem) nextScreenElem.classList.remove('hidden-screen');

            currentScreenIndex = nextScreenIndex;
            isAnswerLocked = false;
            markSolvedAnswersAcrossAllScreens();

            const followingScreen = screensConfig[currentScreenIndex + 1];
            if (followingScreen) {
              runWhenIdle(() => prepareScreen(followingScreen.id));
            }
          } finally {
            isScreenTransitioning = false;
          }
        } else {
          popupWrapper.classList.add('hidden');
          setTimeout(() => {
            congratulationCard.style.willChange = 'transform, opacity';
            congratulationWrapper.classList.remove('hidden');
            launchConfetti();
            playCorrectSound();
          }, 400);
        }
      } else {
        popupWrapper.classList.add('hidden');
      }
    });
  }

  if (btnNext) {
    btnNext.addEventListener('click', () => {
      stopConfetti();
      window.parent.postMessage({ type: 'navigate', url: encodeURI('./도로화면/scene2.html') }, '*');
    });
  }

  runWhenIdle(() => {
    prepareScreen(screensConfig[1].id);
    preparePopupAssets();
  });
});
  </script>
